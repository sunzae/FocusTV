<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FocusTV</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

body{height:100vh;background:#fafafa;display:flex;justify-content:center;align-items:center;flex-direction:column;position:relative;overflow:hidden;}

/* TV container */
.tv-container{
  position:relative;
  width:700px;
  height:500px;
  background:#222;
  border-radius:40px;
  padding:30px;
  box-shadow:0 30px 70px rgba(0,0,0,0.3);
  display:flex;
  justify-content:center;
  align-items:center;
}

.screen{
  position:relative;
  width:100%;
  height:100%;
  border-radius:25px;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  transition:opacity 0.4s ease, background 0.5s ease;
}

/* CRT flicker */
.crt{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 2px);
  
  opacity:0;
  transition:opacity 0.2s ease;
}
@keyframes flicker{
  0%{opacity:0.05;}
  50%{opacity:0.1;}
  100%{opacity:0.05;}
}

/* Views */
.view{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  padding:20px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.5s ease;
}
.view.active{
  opacity:1;
  pointer-events:auto;
}

/* To-do list */
.todo input{
  width:80%;
  padding:12px;
  border-radius:14px;
  border:none;
  margin-bottom:15px;
  font-size:16px;
  outline:none;
  background:#f0f0f0;
}
.todo ul{
  list-style:none;
  width:80%;
  overflow-y:auto;
  max-height:100%;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.todo li{
  position:relative;
  background:#fff;
  padding:10px 14px;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  overflow:hidden;
}

.todo li .task-content{
  transition:transform 0.25s ease;
}

.todo li:hover .task-content{
  transform:translateX(-60px);
}

.todo li .focus-btn{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  padding:6px 10px;
  font-size:12px;
  border:none;
  border-radius:8px;
  background:#222;
  color:#fff;
  cursor:pointer;
  opacity:0;
  transition:opacity 0.2s ease;
}
.todo li .delete-btn{
  position:absolute;
  right:70px;
  top:50%;
  transform:translateY(-50%);
  padding:6px 8px;
  font-size:12px;
  border:none;
  border-radius:8px;
  background:#ff6b6b;
  color:#fff;
  cursor:pointer;
  opacity:0;
  transition:opacity 0.2s ease;
}

.todo li:hover .delete-btn{
  opacity:1;
}


.todo li:hover .focus-btn{
  opacity:1;
}

.todo li:hover{background:#e3e3e3;}

/* Timer */
.timer{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border-radius:16px;
  font-family:'Inter',sans-serif;
  background:#fefcf8;
  transition:background 0.3s ease;
}
.timer h2{
  font-size:24px;
  margin-bottom:12px;
  color:#222;
  text-align:center;
  width:80%;
  border-bottom:1px solid rgba(0,0,0,0.1);
  padding-bottom:6px;
}
#time{
  font-size:50px;
  margin:15px 0;
  color:#222;
  cursor:text;
  padding:6px 12px;
  border-radius:12px;
  background:rgba(255,255,255,0.3);
  min-width:140px;
  text-align:center;
}
.timer-controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:15px;
  justify-content:center;
}
.color-wrapper{
  position: relative;
  width: 26px;
  height: 26px;
}

.color-wrapper input[type="color"]{
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.color-dot{
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #fefcf8;
  border: 1px solid rgba(0,0,0,0.15);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.color-wrapper:hover .color-dot{
  transform: scale(1.08);
  box-shadow: 0 4px 10px rgba(0,0,0,0.18);
}

.timer-controls button{
  padding:8px 16px;
  border:none;
  border-radius:12px;
  background:#222;
  color:#fff;
  cursor:pointer;
  font-size:16px;
  transition:background 0.3s, transform 0.1s;
}
.timer-controls button:hover{background:#555;}
.timer-controls button:active{transform:scale(0.95);}
#bgColor{
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  cursor:pointer;
}

/* Remote toggle button below TV */
.remote-btn{
  margin-top:25px;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#222;
  border:none;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  transition:transform 0.2s;
}
.remote-btn:active{transform:scale(0.95);}

/* Snake Game */
#snakeCanvas{
  background:#111;
  border-radius:20px;
}

/* Chicken mascot */
#cuteCharacter{
  position:absolute;
  width:160px;
  height:140px;
  pointer-events:auto;
  z-index:999;
}
.chicken-body{
  width:120px;
  height:140px;
  background:linear-gradient(to bottom,#ffde59 0%,#fcd34d 100%);
  border-radius:50% 50% 40% 40%;
  position:relative;
  transform-origin:center bottom;
}
.eye{
  width:30px; height:30px; background:#fff; border-radius:50%; position:absolute; top:25px;
}
.eye.left{left:20px;}
.eye.right{left:70px;}
.pupil{width:12px; height:12px; background:#222; border-radius:50%; position:absolute; top:9px; left:9px;}
.eyelid{width:30px; height:15px; background:#ffde59; position:absolute; top:0; left:0; border-radius:50% 50% 0 0; opacity:0; transition:0.2s;}
.beak{width:20px; height:15px; background:#e67e22; position:absolute; top:60px; left:50%; transform:translateX(-50%) rotate(0deg); border-radius:4px;}
.leg{width:10px; height:30px; background:#e67e22; position:absolute; bottom:0;}
.leg.left{left:35px;}
.leg.right{right:35px;}
.wing{width:30px; height:20px; background:#f5c242; position:absolute; top:50px; left:10px; border-radius:50%; transform-origin:top center;}

/* Session View */
#sessionView{
  background:#222;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:20px;
  border-radius:20px;
  height:100%;
}


#sessionsContainer{
  width:100%;
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-right:6px;
}

.session-entry{
  position:relative;
  display:flex;
  align-items:center;
  padding:10px 12px;
  background:#333;
  border-radius:10px;
  flex-shrink: 0;
  overflow:hidden;
}

.session-content{
  display:flex;
  flex-direction:column;
  gap:4px;
  transition:transform 0.25s ease;
}

.session-title{
  font-size:14px;
  font-weight:500;
  color:#fff;
}

.session-meta{
  font-size:12px;
  color:rgba(255,255,255,0.6);
}

.session-delete{
  position:absolute;
  right:12px;
  opacity:0;
  transform:translateX(10px);
  background:rgba(255,77,79,0.15);
  border:none;
  color:#ff6b6b;
  border-radius:6px;
  font-size:12px;
  padding:4px 6px;
  cursor:pointer;
  transition:opacity 0.2s ease, transform 0.2s ease;
}

.session-entry:hover .session-content{
  transform:translateX(-18px);
}

.session-entry:hover .session-delete{
  opacity:1;
  transform:translateX(0);
}

.session-entry button:hover{background:#ff7875;}
.session-section{
  margin:16px 0 6px;
  font-size:13px;
  font-weight:600;
  color:rgba(255,255,255,0.6);
}
/* ===== Minimal Remote Control ===== */

/* Invisible hover zone on the right */
#remoteWrapper{
  position:fixed;
  top:0;
  right:0;
  width:120px; /* hover buffer */
  height:100vh;
  z-index:1000;
}

#remoteHoverZone{
  position:absolute;
  top:0;
  right:0;
  width:20px;
  height:100%;
}


/* Remote container */
#remote{
  position:fixed;
  top:50%;
  right:-90px;
  transform:translateY(-50%);
  opacity:0;
  transition:
    right 0.6s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.4s ease;
  z-index:1001;
}

/* Remote body */
.remote-shell{
  width:56px;
  height:250px; /* ~half of 500px TV */
  background:linear-gradient(to bottom, #2b2b2b, #1a1a1a);
  border-radius:32px;
  box-shadow:
    0 25px 50px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.05);
  padding:16px 0;

  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
  align-items:center;
}

/* Remote buttons */
.remote-button{
  width:28px;
  height:28px;
  border-radius:50%;
  background:radial-gradient(circle at top, #3a3a3a, #1f1f1f);
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.06),
    inset 0 -2px 6px rgba(0,0,0,0.7);
  cursor:pointer;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
display:flex;
align-items:center;
justify-content:center;

}

.remote-button:hover{
  transform:scale(1.1);
}

.remote-button:active{
  transform:scale(0.95);
  box-shadow:
    inset 0 4px 8px rgba(0,0,0,0.8);
}

/* Reveal behavior */
#remoteWrapper:hover #remote{
  right:20px;
  opacity:1;
}

/* ===== Account & Settings Views ===== */
/* ===== Account Card (Driver License Style) ===== */


/* Header row */
.account-header{
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 6px;
}


/* Profile photo */
.account-avatar{
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg,#64748b,#334155);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #e5e7eb;
  flex-shrink: 0;
  overflow: hidden;
}

.account-avatar img{
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Name + username */
.account-identity{
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.account-name{
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: #f8fafc;
}

.account-username{
  font-size: 12px;
  letter-spacing: 0.4px;
  opacity: 0.55;
}


/* Divider */
.account-divider{
  height: 1px;
  background: linear-gradient(
    to right,
    transparent,
    rgba(255,255,255,0.15),
    transparent
  );
}

/* Stats row */
.account-stats{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}


.account-stat{
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.account-stat-value{
  font-size: 16px;
  font-weight: 600;
  color: #f8fafc;
}

.account-stat-label{
  font-size: 11px;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}

/* Subtle footer text */
.account-footer{
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  text-align: center;
}

#accountView,
#settingsView{
  background: linear-gradient(180deg, #0f172a, #020617);
  color: #e5e7eb;
  border-radius: 20px;
  justify-content: center;
  gap: 12px;
  text-align: center;
}

#accountView h2,
#settingsView h2{
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

#accountView div,
#settingsView div{
  font-size: 15px;
  opacity: 0.85;
}
/* ===== Hide special views from main cycle ===== */
.special-view{
  display:none;
}

.special-view.active{
  display:flex;
}
/* ===== Ultra-subtle right-edge discovery hint ===== */
#edgeAffordance{
  position:fixed;
  top:50%;
  right:0;
  width:3px;
  height:90px;
  transform:translateY(-50%);
  background:linear-gradient(
    to left,
    rgba(255,255,255,0.06),
    rgba(255,255,255,0.015),
    transparent
  );
  border-radius:6px 0 0 6px;
  pointer-events:none;
  z-index:500;
}
/* ===== ACCOUNT CARD 3D FLIP (REQUIRED) ===== */
.account-flip{
  position: relative;
  width: 100%;
  height: 260px;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 1200px;
}

.account-card{
  position: absolute;
  inset: 0;
  margin: auto;

  width: 85%;
  max-width: 420px;
  height: 260px;

  border-radius: 26px;
  padding: 24px;
outline: 1px solid rgba(255,255,255,0.12);


background: linear-gradient(
  180deg,
  rgba(255,255,255,0.18),
  rgba(255,255,255,0.06)
);


  box-shadow:
    0 30px 60px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.12);

  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.08);

  display: flex;
  flex-direction: column;
  gap: 18px;

  transform-style: preserve-3d;
}


/* Front side */
.account-front{
  position: absolute;
  inset: 0;

  transform: rotateY(0deg);
  backface-visibility: hidden;
will-change: transform;
  transform-style: preserve-3d;
}


/* Back side */
.account-back{
  position: absolute;
  inset: 0;

  transform: rotateY(-180deg);
  backface-visibility: hidden;

  will-change: transform;
  transform-style: preserve-3d;

  background: radial-gradient(circle at top left,#1e293b,#020617);
  display:flex;
  align-items:center;
  justify-content:center;
}




/* Click flip (REQUIRED) */
.account-flip.flipped .account-front{
  transform: rotateY(180deg);
}
.account-flip.flipped .account-back{
  transform: rotateY(0deg);
}


.back-title{
  font-size: 22px;
  font-weight: 600;
  color: #f8fafc;
}

.back-sub{
  font-size: 14px;
  opacity: 0.75;
  margin-top: 6px;
}

.back-id{
  font-size: 11px;
  opacity: 0.4;
  margin-top: 16px;
}






</style>

<script>


// ---------- Toggle logic ----------
let mode=0;
const views=['todoView','snakeView','timerView','sessionView'];

const crt=document.createElement('div');
crt.classList.add('crt');
document.getElementById('screen').appendChild(crt);
function cycleMode(){
  crt.style.opacity=0.1;
  setTimeout(()=>{
    mode=(mode+1)%views.length;
    renderView();


    crt.style.opacity=0;
  },200);
}
function renderView(){

  // 🔒 FORCE-CLOSE Account & Settings
  // close account & settings, NOT welcome
['accountView','settingsView'].forEach(id=>{
  const el = document.getElementById(id);
  if(el) el.classList.remove('active');
});


  // normal app switching
  views.forEach(id =>
    document.getElementById(id).classList.remove('active')
  );

  document.getElementById(views[mode]).classList.add('active');

  if(mode===1) startSnake();
  if(mode===3) renderSessions();
}


function activateSpecialView(id){
  document.querySelectorAll('.view').forEach(v=>{
    v.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
}

function openAccount(){
  activateSpecialView('accountView');
}

function openSettings(){
  activateSpecialView('settingsView');
}

// ---------- Timer ----------
let timerSeconds = 1500, interval = null;
let initialTimerSeconds = 1500;
let timerRunning = false;
let currentFocusedTask = null;


const timerView=document.getElementById('timerView');
const bgColorInput=document.getElementById('bgColor');
const timeDisplay=document.getElementById('time');
window.addEventListener('load',()=>{
  const savedSeconds=localStorage.getItem('timerSeconds');
  const savedFocus=localStorage.getItem('focusName');
  const savedColor=localStorage.getItem('timerBgColor');
  if(savedSeconds){ timerSeconds=parseInt(savedSeconds); timeDisplay.textContent=formatTime(timerSeconds);}
  if(savedFocus){ document.getElementById('focusName').textContent=savedFocus;}
  if(savedColor){
  bgColorInput.value = savedColor;
  timerView.style.background = savedColor;
  colorDot.style.background = savedColor;
}

});
function saveTimer(){
  localStorage.setItem('timerSeconds',timerSeconds);
  localStorage.setItem('focusName',document.getElementById('focusName').textContent);
  localStorage.setItem('timerBgColor',bgColorInput.value);
}
timeDisplay.addEventListener('input',saveTimer);
document.getElementById('focusName').addEventListener('input',saveTimer);
const colorDot = document.getElementById('colorDot');

colorDot.style.background = bgColorInput.value;

bgColorInput.addEventListener('input',()=>{
  timerView.style.background = bgColorInput.value;
  colorDot.style.background = bgColorInput.value;
  saveTimer();
});

function parseTime(str){
  const parts=str.split(':'); let m=parseInt(parts[0])||0,s=parseInt(parts[1])||0; return m*60+s;
}
function formatTime(sec){ const m=Math.floor(sec/60); const s=sec%60; return `${m}:${s.toString().padStart(2,'0')}`;}
function startTimer(){
  if (timerRunning) stopTimer();
  timerRunning = true;
  initialTimerSeconds = parseTime(timeDisplay.textContent);
  timerSeconds = initialTimerSeconds;
  timerView.style.background = bgColorInput.value;


  interval = setInterval(() => {
    if (timerSeconds <= 0) {
      stopTimer();
      mode = 1;
      renderView();
      return;
    }
    timerSeconds--;
    timeDisplay.textContent = formatTime(timerSeconds);
  }, 1000);
}

function stopTimer(){
  if (!timerRunning) return;
  clearInterval(interval);
  timerRunning = false;
  recordTimerSession();
}

function resetTimer(){
  clearInterval(interval);
  timerRunning = false;
  timerSeconds = initialTimerSeconds;
  timeDisplay.textContent = formatTime(timerSeconds);
  timerView.style.background = bgColorInput.value;
}

// ---------- Snake ----------
const canvas=document.getElementById('snakeCanvas'); const ctx=canvas.getContext('2d');
const scale=20, rows=canvas.height/scale, cols=canvas.width/scale;
let snake=[{x:10,y:10}],dx=1,dy=0,snakeLength=1,food={x:15,y:10},gameInterval=null;
function drawSnakeGame(){ ctx.fillStyle="#111"; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle="#ff6ec7"; ctx.fillRect(food.x*scale,food.y*scale,scale,scale); ctx.fillStyle="#a0e7e5"; snake.forEach(seg=>ctx.fillRect(seg.x*scale,seg.y*scale,scale,scale));}
function updateSnake(){ const head={x:(snake[snake.length-1].x+dx+cols)%cols,y:(snake[snake.length-1].y+dy+rows)%rows}; snake.push(head); if(head.x===food.x && head.y===food.y){ snakeLength++; food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};} while(snake.length>snakeLength) snake.shift(); for(let i=0;i<snake.length-1;i++){ if(snake[i].x===head.x && snake[i].y===head.y){ snakeLength=1; snake=[{x:10,y:10}]; dx=1;dy=0; } } drawSnakeGame();}
function startSnake(){ if(gameInterval) clearInterval(gameInterval); if(mode===1) gameInterval=setInterval(updateSnake,100);}
document.addEventListener('keydown',e=>{ if(e.key==='ArrowUp' && dy===0){dx=0;dy=-1;} if(e.key==='ArrowDown' && dy===0){dx=0;dy=1;} if(e.key==='ArrowLeft' && dx===0){dx=-1;dy=0;} if(e.key==='ArrowRight' && dx===0){dx=1;dy=0;}});

// ---------- Chicken mascot ----------
const char=document.getElementById('cuteCharacter');
let charX=100,charY=window.innerHeight-180,charDir=1,stepCounter=0,charState='walk';
const legs=char.querySelectorAll('.leg'); const body=char.querySelector('.body'); const eyelids=char.querySelectorAll('.eyelid');
function updateCharacter(){ const stepSpeed=0.4; char.style.opacity=1; if(charState==='walk'){ charX+=stepSpeed*charDir; stepCounter+=0.08; charY=window.innerHeight-180+Math.sin(stepCounter*2)*1.5; legs[0].style.transform=`rotate(${Math.sin(stepCounter*3)*15}deg)`; legs[1].style.transform=`rotate(${Math.sin(stepCounter*3+Math.PI)*15}deg)`; body.style.transform=`rotate(${Math.sin(stepCounter*2)*2}deg)`; if(Math.random()<0.002) charState='idle';} else if(charState==='idle'){ if(Math.random()<0.01){ charState='flap'; setTimeout(()=>charState='walk',300);}} else if(charState==='flap'){ body.style.transform='rotate(-5deg)';} if(charX<0){ charX=0; charDir=1;} if(charX+160>window.innerWidth){ charX=window.innerWidth-160; charDir=-1;} if(Math.random()<0.01){ eyelids.forEach(e=>e.style.opacity=1); setTimeout(()=>eyelids.forEach(e=>e.style.opacity=0),200);} char.style.left=charX+'px'; char.style.top=charY+'px'; char.style.transform=`scaleX(${charDir})`; requestAnimationFrame(updateCharacter);}
updateCharacter();
char.addEventListener('click',()=>{ const wings=char.querySelectorAll('.wing'); wings.forEach(w=>w.style.transform='rotate(35deg)'); eyelids.forEach(e=>e.style.opacity=1); setTimeout(()=>{ wings.forEach(w=>w.style.transform='rotate(0deg)'); eyelids.forEach(e=>e.style.opacity=0); },600);});

// ---------- Session Tracker ----------
const sessionsContainer=document.getElementById('sessionsContainer');
function getSessions(){ return JSON.parse(localStorage.getItem('sessions'))||[]; }
function addSession(durationSeconds){
  const now = new Date();
  const focusName = document.getElementById('focusName').textContent.trim() || 'Untitled Session';

  const sessions = getSessions();
  sessions.push({
    timestamp: now.getTime(),
    duration: durationSeconds,
    name: focusName
  });

  localStorage.setItem('sessions', JSON.stringify(sessions));
}

function recordTimerSession(){
  const elapsed = initialTimerSeconds - timerSeconds;
  if (elapsed > 0) {
    addSession(elapsed);

    if (currentFocusedTask) {
      currentFocusedTask.remove();
      currentFocusedTask = null;
      saveTasks();
    }
  }
}


function formatDate(ts){
  const d = new Date(ts);
  return d.toLocaleString('en-IN', {
    year: '2-digit',
    month: 'numeric',
    day: 'numeric',
    hour: 'numeric',
    minute: '2-digit',
    hour12: true
  });
}
function getSessionBucket(timestamp){
  const now = new Date();
  const d = new Date(timestamp);

  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  const thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  if (d >= today) return 'Today';
  if (d >= yesterday && d < today) return 'Yesterday';
  if (d >= thisMonth) return 'This Month';
  return 'Earlier';
}


function renderSessions(){
  const sessions = getSessions().slice().reverse();
  sessionsContainer.innerHTML = '';

  const groups = {};

  sessions.forEach(s => {
    const group = getSessionBucket(s.timestamp);
    if (!groups[group]) groups[group] = [];
    groups[group].push(s);
  });

  Object.keys(groups).forEach(groupName => {

    const header = document.createElement('div');
    header.className = 'session-section';
    header.textContent = groupName;
    sessionsContainer.appendChild(header);

    groups[groupName].forEach(s => {
      const div = document.createElement('div');
      div.className = 'session-entry';

      const content = document.createElement('div');
      content.className = 'session-content';

      const title = document.createElement('div');
      title.className = 'session-title';
      title.textContent = s.name;

      const meta = document.createElement('div');
      meta.className = 'session-meta';
      meta.textContent =
        formatDate(s.timestamp) + ' • ' +
        Math.floor(s.duration/60) + ' min ' +
        (s.duration % 60) + ' sec';

      content.appendChild(title);
      content.appendChild(meta);

      const btn = document.createElement('button');
      btn.className = 'session-delete';
      btn.textContent = '✕';
      btn.onclick = () => {
        const all = getSessions();
        const idx = all.findIndex(x => x.timestamp === s.timestamp);
        all.splice(idx, 1);
        localStorage.setItem('sessions', JSON.stringify(all));
        renderSessions();
      };

      div.appendChild(content);
      div.appendChild(btn);
      sessionsContainer.appendChild(div);
    });
  });
}
